<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Controller UI with Bluetooth</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none; /* 터치 드래그 시 화면 스크롤 방지 */
    }

    /* 컨트롤러 프레임 */
    .controller-frame {
      width: 90%;
      max-width: 480px;
      height: 250px;
      background: #22252a;
      border-radius: 24px;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid #333740;
    }

    /* 슬라이더 그룹 */
    .wheel-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      color: #8a8f99;
      letter-spacing: 1px;
    }

    /* 세로 슬라이더 */
    .vertical-slider {
      appearance: none;
      -webkit-appearance: slider-vertical;
      width: 30px;
      height: 150px;
      background: #15171a;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
    }

    /* 중앙 패널 */
    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #181a1d;
      padding: 18px 15px;
      border-radius: 16px;
      border: 1px solid #2d3139;
      width: 140px;
    }

    /* 블루투스 연결 버튼 */
    .ble-btn {
      width: 100%;
      padding: 8px 0;
      border-radius: 8px;
      border: none;
      background: #00adb5;
      color: white;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #00757a;
      transition: all 0.15s ease;
    }

    .ble-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #00757a;
    }

    .ble-btn.connected {
      background: #5cb85c;
      box-shadow: 0 3px 0 #3d8b3d;
    }

    /* ON/OFF 버튼 */
    .toggle-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      color: #666666;
      background: #25282e;
      box-shadow: 0 4px 0 #15171a;
      transition: all 0.15s ease;
    }

    /* ON 활성화 상태 */
    .toggle-btn.active {
      color: #ffffff;
      background: #e74c3c; /* 무기/공격 활성화 표시용 빨간색 */
      box-shadow: 0 0 12px rgba(231, 76, 60, 0.5), 0 2px 0 #c0392b;
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div class="controller-frame">
    <!-- 왼쪽 바퀴 제어 슬라이더 -->
    <div class="wheel-control">
      <span class="label">LEFT</span>
      <input type="range" id="leftSlider" class="vertical-slider" min="-100" max="100" value="0">
    </div>

    <!-- 중앙 패널 (블루투스 연결 & 무기 토글) -->
    <div class="center-panel">
      <button class="ble-btn" id="bleBtn" onclick="connectBLE()">CONNECT</button>
      <span class="label">WEAPON</span>
      <button class="toggle-btn" id="pwrBtn" onclick="togglePower()">OFF</button>
    </div>

    <!-- 오른쪽 바퀴 제어 슬라이더 -->
    <div class="wheel-control">
      <span class="label">RIGHT</span>
      <input type="range" id="rightSlider" class="vertical-slider" min="-100" max="100" value="0">
    </div>
  </div>

  <script>
    // --- 1. BLE 블루투스 통신 설정 ---
    // ESP32 아두이노 코드에 설정된 UUID 값과 동일해야 합니다.
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleCharacteristic = null;

    // 블루투스 연결 함수
    async function connectBLE() {
      const bleBtn = document.getElementById('bleBtn');
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'BattleRobot_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        bleBtn.textContent = "CONNECTED";
        bleBtn.classList.add('connected');
        alert("ESP32 연결 성공!");
      } catch (error) {
        console.error("BLE 연결 에러:", error);
        alert("연결 실패: " + error);
      }
    }

    // ESP32로 데이터를 전송하는 공통 함수
    function sendData(dataStr) {
      if (bleCharacteristic) {
        const encoder = new TextEncoder();
        bleCharacteristic.writeValueWithoutResponse(encoder.encode(dataStr)).catch(() => {});
      }
    }

    // --- 2. 슬라이더 조작 및 복귀 로직 ---
    const leftSlider = document.getElementById('leftSlider');
    const rightSlider = document.getElementById('rightSlider');
    const sliders = [leftSlider, rightSlider];

    // 실시간 이동 값 전송 함수 (예: "DRIVE:50,-80")
    function sendDriveData() {
      const leftVal = leftSlider.value;
      const rightVal = rightSlider.value;
      sendData(`DRIVE:${leftVal},${rightVal}`);
    }

    // 슬라이더를 잡고 움직일 때 실시간 전송
    leftSlider.addEventListener('input', sendDriveData);
    rightSlider.addEventListener('input', sendDriveData);

    // 손을 떼었을 때 위치 복귀 및 정지 데이터(0) 전송
    sliders.forEach(slider => {
      const resetPosition = () => {
        slider.value = 0;
        sendDriveData(); // 위치가 0으로 돌아갔음을 ESP32에 전송
      };

      slider.addEventListener('pointerup', resetPosition);
      slider.addEventListener('touchend', resetPosition);
      slider.addEventListener('mouseup', resetPosition);
    });

    // --- 3. 무기/전원 ON/OFF 토글 로직 ---
    function togglePower() {
      const btn = document.getElementById('pwrBtn');
      btn.classList.toggle('active');
      const isOn = btn.classList.contains('active');
      
      btn.textContent = isOn ? 'ON' : 'OFF';

      // ESP32로 무기 상태 전송 (예: "WEAPON:1" 또는 "WEAPON:0")
      sendData(`WEAPON:${isOn ? 1 : 0}`);
    }
  </script>

</body>
</html>
